{% extends 'base.html' %}

{% block title %}
    Reset Password
{% endblock %}

{% block content %}
    <h2>Forgot your password?</h2>
    <p>Enter you mail address below, and we'll send you a link to reset your password.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Send Reset Link" class="btn btn-primary">
    </form>
    <p class="mt-3">
        <a href="{% url 'login' %}">Back to login</a>
    </p>
{% endblock %}
